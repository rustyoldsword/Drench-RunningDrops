; Drench running drops - sweat (DripSim's sweat mode). Press F10 in game to re-read this file.
; The sweat follows Drench: it starts with Drench's sweat phase and grows until soaked with sweat (sprinting, magic, arousal, scenes...).
; Beads come out of the skin, grow, merge and run down along the live pose; a thin sheen lies over the skin while it is warm.

; 0 = the heat comes only from Drench's sweat. 1 = DripSim's own effort model as well (sprint, fight, low stamina)
OwnHeat=0
Auto=true
; starts above this heat (Drench sends 0.3 at its sweat start, 1.0 once soaked with sweat)
StartHeat=0.25
; seconds a full heat takes to fall to 0 once Drench's sweat is over
CoolTime=120
; new beads per second over the whole body at full heat, and their size
Rate=80
Size=1.0
; look: wet halo, glints, opacity of the beads, the even sheen over the skin
Wet=1.0
Gloss=1.6
Opacity=0.6
Film=0.6
; seconds the beads take to dry once the body has cooled
DryTime=70
MaxBeads=1600
MaxRunners=40
; 0 = resting drops are not drawn: only running drops, their wet trails and the water sheet after a bath show (the drops are still simulated and feed the runs)
DrawBeads=1
; drawn size of a resting drop (the runs keep their size). Small drops by default
BeadScale=0.8
; sweat runs down the body; the face only gets beads that stay
DripBody=1
DripFace=0
Face=1
