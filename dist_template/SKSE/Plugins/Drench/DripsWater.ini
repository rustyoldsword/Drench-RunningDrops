; Drench running drops - water (DripSim's rain and soak). Press F10 in game to re-read this file.
; Rain under open sky lands as beads that merge and run down; leaving deep water, washing (Bathing in Skyrim) and scripts that soak the player
; (Drench SetWetness up to the soaked phase) pour water over the whole body that then drains.

; start by itself when it rains and nothing is above your head (roof, tree, overhang)
Auto=true
; no rain on you under a roof or tree. false = rain wets you whenever the weather is rainy (even indoors)
NeedSky=true
; starts by itself above this rain intensity (a drizzle is ~0.2-0.5; Drench.log 'Rain: idle, intensity ..' shows the live value)
StartIntensity=0.2
; how much lands: new drops per second over the whole body at full rain, and the size of the beads
Rate=110
Size=1.0
; look: wet-darkened skin around the water (Wet), glints on the beads (Gloss), opacity of the water body (Opacity)
Wet=1.0
Gloss=1.5
Opacity=0.6
; seconds the beads take to dry once the rain stops
DryTime=45
MaxBeads=1200
; sliding drops at once (the beads that are heavy for their slope start to run; more = more rivulets)
MaxRunners=60
; 0 = resting drops are not drawn: only running drops, their wet trails and the water sheet after a bath show (the drops are still simulated and feed the runs)
DrawBeads=1
; drawn size of a resting drop (0.2-2.0; the runs keep their size). Small drops by default
BeadScale=0.5
; wet skin sheen under the water: Sheen = strength (0 = off), Shininess = gloss exponent (higher = tighter)
Sheen=2.0
Shininess=130
; dripping per skin part: 1 = the water runs down it, 0 = the beads just stay and merge
DripBody=1
DripHands=1
DripFeet=1
DripFace=0
; the film's normal map: how strongly the water's thickness bends the surface for the engine's lights (0 = none). Needs NormalMaps=1 in Drips.ini.
NormalStrength=1.5

; soak: water poured over the body (washing, a script, leaving deep water)
EnableSoak=1
; leaving water you stood in at least this deep (game units above the feet) for SoakMinTime seconds starts a soak by itself
AutoSoak=1
SoakMinDepth=25
SoakMinTime=1.0
; seconds the poured water keeps coming off the skin
SoakTime=30
