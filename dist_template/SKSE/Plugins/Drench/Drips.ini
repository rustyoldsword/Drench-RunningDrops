; Drench running drops: the embedded DripSim framework (https://github.com/antiarc9/DripSim, GPL-3.0-or-later).
; On/off switches are in Drench's menu (Running drops, Sweat drops, Water drops). F10 in game re-reads this file and DripsWater.ini / DripsSweat.ini.
; Needs RaceMenu: the drops are drawn into a free body overlay slot ("Body [Ovl#]").
Enabled=true
; precipitation particle density that counts as the heaviest rain. Drench.log shows each weather's value as you meet it.
RainDensityRef=1500
; NormalMaps=1: the water also gets a normal map, so the game's lights (and ENB) make real highlights on the drops. Takes effect the next time the effect starts.
; Drench: off by default. With it on, 3BA (model-space) overlays draw the water only as faint highlights; UBE ignores it anyway.
NormalMaps=0
; with NormalMaps: a gloss map in the overlay's specular slot (wet skin shines, dry does not)
SpecMaps=1
; F10 re-reads the drop settings (0 = no key)
ReloadKey=1
; DripSim's own test keys (Shift+G forced rain and so on): off, Drench drives the drops
Hotkeys=0
AutoReport=0
