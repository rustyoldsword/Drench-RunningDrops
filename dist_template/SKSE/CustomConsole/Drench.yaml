name: drench
help: "Drench - Wet Skin Framework. Commands act on the crosshair actor, or the player"
script: Drench
subs:
  - name: status
    alias: st
    func: ConsoleStatus
    help: "Show wetness, rate, state and flags"
    args: []
  - name: start
    func: ConsoleStart
    help: "Start the effect (manual effects never stop by themselves)"
    args: []
  - name: stop
    func: ConsoleStop
    help: "Stop the effect and dry the actor"
    args: []
  - name: soak
    func: ConsoleSoak
    help: "Start the effect and set wetness to the cap"
    args: []
  - name: dry
    func: ConsoleDry
    help: "Set wetness to zero"
    args: []
  - name: release
    func: ConsoleRelease
    help: "Release forced wetness, specular and glossiness values"
    args: []
  - name: report
    func: ConsoleReport
    help: "Dump status, skin mode and every skin geometry: live shader values, textures, and what Drench wrote"
    args: []
  - name: clean
    func: ConsoleClean
    help: "Remove RaceMenu overrides left by WetFunction (Redux, NG, Dewpoint 1.0) from the target and the player"
    args: []
  - name: reload
    func: ConsoleReload
    help: "Reload Drench.ini"
    args: []
  - name: stopall
    func: ConsoleStopAll
    help: "Stop every running effect"
    args: []
  - name: shine
    func: ConsoleShine
    help: "Shine only for this character from now on, in every save: the skin keeps its own maps"
    args: []
  - name: exclude
    func: ConsoleExclude
    help: "Never wet this character, in every save"
    args: []
  - name: normal
    func: ConsoleNormal
    help: "Wet this character normally again"
    args: []
